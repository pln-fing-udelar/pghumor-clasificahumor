[project]
name = "clasificahumor"
version = "0.1.0.dev0"
description = "Website to crowd-annotate tweets for Humor Research."
authors = [
    { name = "Santiago Castro", email = "sacastro@fing.edu.uy" },
]
requires-python = ">=3.15"
dependencies = [
    "cryptography",
    "fastapi<1",
    "httptools",
    "jinja2<4",
    "pydantic>=2,<3",
    "python-multipart<1",
    "sentry-sdk<3",
    "sqlalchemy[asyncmy]<3",
    "starlette",
    "uvicorn<1",
    "uvloop",
]

[project.urls]
homepage = "https://www.clasificahumor.com/"
repository = "https://github.com/pln-fing-udelar/pghumor-clasificahumor"

[dependency-groups]
dev = [
    "aiosqlite<1",
    "httpx2>=2,<3",
    "jq<2",
    "krippendorff<1",
    "mycli>=2,<3",
    "mysqlclient<3",
    "pandas<4",
    "pandas-stubs",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.3,<1",
    "tweepy<5",
    "tqdm<5",
    "ty<1",
    "types-tqdm",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--cov=clasificahumor --cov-report=term-missing --cov-fail-under=90"
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["clasificahumor"]

[tool.ruff.lint]
ignore = [
    "ANN002", # `*args` / `**kwargs`: the only annotation that fits is `Any`, which ANN401 then rejects.
    "ANN003",
    "ANN401", # Allow `Any` for function args.
    "N803",
    "N806",
    "N812",
]
select = ["ANN", "B", "C", "C90", "E", "F", "I", "N", "RUF", "TID", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403"]

[tool.ty.environment]
extra-paths = ["src/extraction"]

[tool.ty.src]
include = ["src/clasificahumor/**/*.py", "src/analysis/**/*.py", "tests/**/*.py"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.xml]
output = "test-reports/coverage.xml"

[tool.coverage.html]
directory = "test-reports/htmlcov"

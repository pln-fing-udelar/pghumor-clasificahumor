services:
  web:
    command: 'uvicorn clasificahumor.__main__:app --host :: --port 80 --reload'
    environment:
      - DB_PASS=123123
    ports:
      - '5000:80'
    volumes:
      - ./web/src/:/app/src
  database:
    environment:
      - MYSQL_ROOT_PASSWORD=123123
      - MYSQL_DATABASE=pghumor
